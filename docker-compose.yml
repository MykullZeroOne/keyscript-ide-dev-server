version: '3.8'

services:
  keyscript-ide:
    image: msmith624/keyscript-ide:latest
    build:
      context: .
      args:
        APP_VERSION: "1.1.0"
    ports:
      - "3000:3000"
    volumes:
      # Mount the host user's home directory so the IDE can browse local files
      # Windows: C:\Users\YourName → /host-home inside the container
      # Mac/Linux: /Users/you or /home/you → /host-home
      - ${HOME:-${USERPROFILE:-~}}:/host-home:rw
      - ./workspace:/workspace:rw
    environment:
      - PORT=3000
      - WORKSPACE_PATH=/workspace
      # Tell the server where the host home directory is mounted
      - HOST_HOME=/host-home
      - PROXY_ENDPOINT=keystonedev.revfcu.com:8443
      - SUPPORTED_INSTANCES=Development|Test|CARDS
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
